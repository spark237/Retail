version: '3.8'
services:
  postgres:
    image: postgres:16-alpine
    container_name: retailguard-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: retailguard
      POSTGRES_USER: retailguard
      POSTGRES_PASSWORD: retailguard_secret_2024
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U retailguard -d retailguard"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: retailguard-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres-data: